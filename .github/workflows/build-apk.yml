name: Build Sulav Proxy APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: SulavProxy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Print APK download information
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "=============================================="
          echo "BUILD SUCCESSFUL"
          echo "APK: app/build/outputs/apk/debug/app-debug.apk"
          echo "DOWNLOAD: Open this GitHub Actions run and download artifact: SulavProxy-debug-apk"
          echo "RUN LINK: $RUN_URL"
          echo "=============================================="
          {
            echo "## ✅ Sulav Proxy APK ready"
            echo
            echo "**Artifact:** \\`SulavProxy-debug-apk\\`"
            echo
            echo "### Download"
            echo "Open the **Artifacts** section at the bottom of this workflow run and download **SulavProxy-debug-apk**."
            echo
            echo "[Open this GitHub Actions run]($RUN_URL)"
            echo
            echo "APK path: \\`app/build/outputs/apk/debug/app-debug.apk\\`"
          } >> "$GITHUB_STEP_SUMMARY"
