name: Build Sulav Proxy APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SulavProxy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Print APK download link
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "=============================================="
          echo "BUILD SUCCESSFUL"
          echo "APK: app/build/outputs/apk/debug/app-debug.apk"
          echo "DOWNLOAD ARTIFACT: SulavProxy-debug-apk"
          echo "GITHUB ACTIONS DOWNLOAD PAGE: $RUN_URL"
          echo "=============================================="
          {
            echo "## ✅ BUILD SUCCESSFUL — Sulav Proxy APK"
            echo
            echo "**APK:** \\`app/build/outputs/apk/debug/app-debug.apk\\`"
            echo
            echo "**Download artifact:** \\`SulavProxy-debug-apk\\`"
            echo
            echo "### 🔗 Download"
            echo "[Open GitHub Actions run and download the APK artifact]($RUN_URL)"
            echo
            echo "At the bottom of the run, open **Artifacts** → **SulavProxy-debug-apk**."
          } >> "$GITHUB_STEP_SUMMARY"
